<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="google-site-verification" content="LN9j9rnThuxyBX7xUovE7mIdmVY6ewQ73npdNPtC1-Q" />

    <!-- Organization / WebSite structured data for E-E-A-T and rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://multitoolsa.com/#organization",
          "name": "Convert",
          "url": "https://multitoolsa.com/",
          "logo": "https://multitoolsa.com/logo.png",
          "description": "Convert provides 100+ free, browser-based image, PDF, SEO and developer tools that process files locally for full privacy.",

        },
        {
          "@type": "WebSite",
          "@id": "https://multitoolsa.com/#website",
          "url": "https://multitoolsa.com/",
          "name": "Convert",
          "publisher": { "@id": "https://multitoolsa.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://multitoolsa.com/all-tools?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
